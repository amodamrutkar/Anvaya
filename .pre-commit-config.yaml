repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-no-truth-leak
        name: Block data/truth/ references
        entry: bash scripts/check_no_truth_leak.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: check-scope
        name: Block out-of-boundary edits
        entry: bash scripts/check_scope.sh
        language: system
        pass_filenames: false
        always_run: true
