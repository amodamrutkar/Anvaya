server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for production performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API endpoints and documentation proxied to the backend container
    location ~ ^/(health|me|metrics|entities|graph|roles|bridges|mule|review-queue|links|dossier|federated|agency|kumbh|connectors|audit|docs|redoc|openapi.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - return index.html for all client-side paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
