# Root pyproject.toml — workspace tooling configuration
# This file configures shared dev tools (ruff, mypy, pytest).
# It is NOT a service package. Services have their own pyproject.toml.
# Owned by M4.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "sutradhar-dev"
version = "0.1.0"
description = "Sutradhar — root dev tooling workspace"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM"]
ignore = ["E501", "E741", "SIM115", "B008", "B007"]

[tool.ruff.lint.isort]
known-first-party = [
  "sutradhar_data",
  "sutradhar_eval",
  "sutradhar_er",
  "sutradhar_graph",
  "sutradhar_api",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["services/api/sutradhar_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "services/api/tests",
  "services/data_gen/tests",
  "services/eval/tests",
  "services/nlp/tests",
  "services/graph/tests",
]
addopts = "-v --tb=short"
