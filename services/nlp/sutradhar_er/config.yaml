# ──────────────────────────────────────────────────────────────────────────────
# Sutradhar Entity Resolution — Configuration
# Thresholds and weights tuned on data/dev/.
# ──────────────────────────────────────────────────────────────────────────────

# Band thresholds
bands:
  auto_threshold: 0.85
  review_threshold: 0.60

# Scoring weights (PRD 4.4)
weights:
  shared_phone:          0.55
  shared_account:        0.60
  shared_vehicle:        0.50
  name_similarity:       0.25   # scaled by JW score
  strong_id_corroboration: 0.11 # strong ID + name match corroboration (PRD 8.3)
  father_name_match:     0.25
  age_within_2:          0.05
  same_district:         0.05
  alias_match:           0.15
  father_name_conflict: -0.30
  age_differ_5:         -0.20
  name_only_penalty:    -0.15   # different phone AND different district AND name only

# Name similarity
name_similarity:
  jaro_winkler_threshold: 0.92
  common_name_threshold: 5       # if a normalised name appears in > N records, require strong id

# Blocking
blocking:
  max_block_size: 200
  age_band_tolerance: 3         # ±3 years for district+surname+age blocking

# Validators
validators:
  phone_pattern: "^[6-9]\\d{9}$"
  ifsc_pattern: "^[A-Z]{4}0[A-Z0-9]{6}$"
  vehicle_pattern: "^[A-Z]{2}\\d{2}[A-Z]{1,3}\\d{4}$"
  account_min_digits: 9
  account_max_digits: 18

# LLM (optional extraction; never for identity resolution)
llm:
  provider: "none"           # none | anthropic | gemini
  cache_path: "llm_cache.jsonl"
  max_retries: 2

# Output
output:
  keep_separate_links: false  # whether to write SEPARATE-band links
  mention_id_prefix: "M-"
  entity_id_counters:
    person: "P-"
    phone: "PH-"
    account: "AC-"
    vehicle: "VH-"
    address: "AD-"
  link_id_prefix: "L-"
