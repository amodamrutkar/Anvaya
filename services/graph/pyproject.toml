[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradhar_graph"
version = "0.1.0"
description = "Graph and network analytics package for Sutradhar intelligence platform"
authors = [{ name = "Member 3", email = "member3@sutradhar.local" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
