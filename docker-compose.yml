version: "3.9"

# Sutradhar — Production-Style Docker Compose Deployment
# Architecture:
# Browser -> Nginx (web :8080) -> FastAPI (api :8000) -> Contracts & Artifacts Store
#
# IMPORTANT: All data is synthetic. Simulated connector boundaries.
# Zero external network calls at runtime.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: sutradhar-api:latest
    container_name: sutradhar-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - APP_ROOT=/app
      - ARTIFACTS_DIR=/app/artifacts
      - DEMO_TAMPER=${DEMO_TAMPER:-0}
      - DEV_AUTH_ENABLED=1
      - DEV_AUTH_SECRET=${DEV_AUTH_SECRET:-sutradhar-deploy-secret-7fea9e1b-4c4a-prod}
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      - DATASET_VERSION=${DATASET_VERSION:-v1}
      - LLM_PROVIDER=none
    volumes:
      # Mount artifacts, contracts, and data so demo/production runs from clean verified inputs
      - ./artifacts:/app/artifacts:ro
      - ./contracts:/app/contracts:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutradhar-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: sutradhar-web:latest
    container_name: sutradhar-web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sutradhar-net

networks:
  sutradhar-net:
    driver: bridge
